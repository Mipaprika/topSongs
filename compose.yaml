services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/top-songs.db
      NETEASE_API_BASE_URL: http://netease-api:3000
    volumes:
      - ./data:/app/data
    depends_on:
      - netease-api
    command: ["tail", "-f", "/dev/null"]

  netease-api:
    build:
      context: .
      dockerfile: Dockerfile.netease-api
    restart: unless-stopped
